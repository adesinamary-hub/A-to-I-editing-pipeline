# config for RNA-Variant discovery snakemake pipeline #

#PICARD:
#  "~/src/picard/picard.jar"
#
#GATK:
#  "/cluster/software/modules-sw/GATK/3.8/GenomeAnalysisTK.jar"
#
#SNPEFF:
#  "/beevol/home/riemondy/bin/snpEff"
#
#PANDOC:
#  "/beevol/home/riemondy/bin/pandoc/"

LIB:
  "./workflow/scripts/"

RAW_DATA:
    "/beevol/home/riemondy/Projects/vicens/data/2022-12-01/star"

DATA: 
    "/beevol/home/riemondy/Projects/vicens/data/2022-12-01/hyperediting"

GENOME:
  "/beevol/home/rbilab/ref/genome/human/GRCh38/dna/Homo_sapiens.GRCh38.dna.primary_assembly.UCSC.fa"

  # path to 3-base bwa indices, will be generated if they do not exist
BWA_IDX:
  "/beevol/home/riemondy/Projects/vicens/dbases/hyperediting/bwa_idx"

SIMPLE_REPEATS:
  "/beevol/home/riemondy/Projects/vicens/dbases/hyperediting/unique_simple_repeats.txt"

# on of fr-first-strand or fr-second-strand
LIBRARY_TYPE:
    - "fr-first-strand"

FASTQ:
    - adar1ko_minus-ifnb/adar1ko_minus-ifnb
    - adar1ko_plus-ifnb/adar1ko_plus-ifnb
    - adar1p150int_minus-ifnb_minus-dox_24hrs/adar1p150int_minus-ifnb_minus-dox_24hrs
    - adar1p150int_minus-ifnb_minus-dox_48hrs/adar1p150int_minus-ifnb_minus-dox_48hrs
    - adar1p150int_minus-ifnb_plus-dox_24hrs/adar1p150int_minus-ifnb_plus-dox_24hrs
    - adar1p150int_plus-ifnb_minus-dox_24hrs/adar1p150int_plus-ifnb_minus-dox_24hrs
    - adar1p150int_plus-ifnb_plus-dox_24hrs/adar1p150int_plus-ifnb_plus-dox_24hrs
    - adar1p150int_plus-ifnb_plus-dox_48hrs/adar1p150int_plus-ifnb_plus-dox_48hrs
    - adar1p150ko_minus-ifnb/adar1p150ko_minus-ifnb
    - adar1p150ko_plus-ifnb/adar1p150ko_plus-ifnb
    - wt_minus-ifnb/wt_minus-ifnb
    - wt_plus-ifnb/wt_plus-ifnb

FASTQ_SUFFIX:
    R1: "_Unmapped.out.mate1.fastq.gz"
    R2: "_Unmapped.out.mate2.fastq.gz"

BAM_SUFFIX:
    "_sorted.bam"

pos_ref:
  - A
  - A
  - A  
  - G
  - G
  - G
  - C
  - C
  - C
  - T
  - T
  - T  

pos_alt: 
  - G 
  - C 
  - T
  - A
  - C
  - T
  - A
  - G 
  - T
  - A
  - G
  - C
