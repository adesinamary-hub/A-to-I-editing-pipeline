# config for RNA-Variant discovery snakemake pipeline #
LIB:
  "./workflow/scripts/"

RAW_DATA:
    "/beevol/home/riemondy/Projects/vicens/data/2023-12-20/star"

DATA: 
    "/beevol/home/riemondy/Projects/vicens/data/2023-12-20/hyperediting"

GENOME:
  "/beevol/home/rbilab/ref/genome/human/GRCh38/dna/Homo_sapiens.GRCh38.dna.primary_assembly.UCSC.fa"

  # path to 3-base bwa indices, will be generated if they do not exist
BWA_IDX:
  "/beevol/home/riemondy/Projects/vicens/dbases/hyperediting/bwa_idx"

SIMPLE_REPEATS:
  "/beevol/home/riemondy/Projects/vicens/dbases/hyperediting/unique_simple_repeats.txt"

# on of fr-first-strand or fr-second-strand
LIBRARY_TYPE:
    - "fr-first-strand"

FASTQ:
  - ADAR1_KO/ADAR1_KO
  - ADAR1_KO_H910Q_E912A/ADAR1_KO_H910Q_E912A
  - ADAR1_KO_p150_minus_DOX/ADAR1_KO_p150_minus_DOX
  - ADAR1_KO_p150_plus_DOX/ADAR1_KO_p150_plus_DOX
  - ADAR1p150_KO/ADAR1p150_KO
  - H910Q_E912A/H910Q_E912A
  - N173A_Y177A/N173A_Y177A
  - N173S/N173S
  - P193A/P193A
  - deltaZalpha/deltaZalpha
  - deltaZbeta/deltaZbeta
  - delta_one/delta_one
  - double/double
  - p150_minus_DOX/p150_minus_DOX
  - p150_plus_DOX/p150_plus_DOX
  - p150_plus_DOX_1mg/p150_plus_DOX_1mg
  - wild-type_minus_IFNb/wild-type_minus_IFNb
  - wild-type_plus_IFNb/wild-type_plus_IFNb
  - wild-type_plus_IFNb_plus_DOX/wild-type_plus_IFNb_plus_DOX
