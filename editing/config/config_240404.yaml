# config for RNA-Variant discovery snakemake pipeline #

#path to raw FASTQ files
RAW_DATA:
    "/beevol/home/riemondy/Projects/vicens/data/2024-04-04/raw_data"
#directory where output files will be stored
DATA: 
    "/beevol/home/riemondy/Projects/vicens/data/2024-04-04"
#path to file containing sequenced file ID and library type.
LIB_PARAMS:
  "config/lib_params_240404.tsv"
#path to reference genome file
GENOME:
  "/beevol/home/rbilab/ref/genome/human/GRCh38/dna/Homo_sapiens.GRCh38.dna.primary_assembly.UCSC.fa"
#path of reference genome FASTA index file generated by samtools 
CHROM_SIZES:
  "/beevol/home/rbilab/ref/genome/human/GRCh38/dna/Homo_sapiens.GRCh38.dna.primary_assembly.UCSC.fa.fai"
#path to indexed reference genome 
GENOME_DIR:
    "/beevol/home/rbilab/ref/indices/star/human/GRCh38-UCSC-2.7.9a"
#filename suffixes for forward and reverse FASTQ reads
FASTQ_SUFFIX:
    R1: "_1.fq.gz"
    R2: "_2.fq.gz"
#path to index and annotation files generated by STAR when the genome index is built
SALMON_IDX:
    "../../dbases/indices/salmon/gencode.v35.transgenes/salmon_idx"
#path to genome transcript annotation file
TRANSCRIPTS:
    "../../dbases/seqs/transcripts/gencode.v35.transcripts.transgene.fasta"

CMD_PARAMS:
    #Replace with correct adapter sequence  
    cutadapt: " -a AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC -A AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT -m 30 "
    fastp: " -u 10 -l 50 -y -x -q 25 "
    salmon_quant: " --validateMappings --libType 'A' --numBootstraps 50 "
    salmon_idx: " -k 31 --gencode "
        
